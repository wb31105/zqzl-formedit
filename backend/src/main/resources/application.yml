server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:mem:flowformdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  jackson:
    serialization:
      write-dates-as-timestamps: false

cors:
  allowed-origins: http://localhost:3000
